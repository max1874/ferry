services:
  ferry:
    image: ${FERRY_IMAGE:-ghcr.io/max1874/ferry:1.0.0}
    container_name: ferry
    environment:
      FERRY_HOST_IP: ${FERRY_HOST_IP:-127.0.0.1}
      FERRY_PORT: ${FERRY_PORT:-42817}
      FERRY_TRUSTED_ORIGIN: ${FERRY_TRUSTED_ORIGIN:-}
      FERRY_LISTEN_HOST: ${FERRY_LISTEN_HOST:-}
      TZ: Asia/Shanghai
    ports:
      - "${FERRY_HOST_IP:-127.0.0.1}:${FERRY_PORT:-42817}:${FERRY_PORT:-42817}"
    volumes:
      - ferry-data:/data
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  ferry-data:
