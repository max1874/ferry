<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Ferry</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand" aria-label="Ferry">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span>Ferry</span>
      </div>
      <div class="top-actions">
        <button class="device-button" id="device-button" type="button" hidden>Devices</button>
        <span class="connection" id="connection">Connecting</span>
      </div>
    </header>

    <section class="pairing" id="pairing" hidden>
      <form class="pairing-card" id="pairing-form">
        <span class="welcome-mark" aria-hidden="true">F</span>
        <h1>Pair this device</h1>
        <p>Enter a code from the Ferry Server or another paired device.</p>
        <label>Device name<input id="device-name" name="device_name" maxlength="64" autocomplete="nickname" required></label>
        <label>Pairing code<input id="pairing-code" name="code" maxlength="16" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required></label>
        <button class="primary" type="submit">Pair device</button>
        <p class="form-error" id="pairing-error" role="alert"></p>
        <small>Ferry currently uses unencrypted HTTP. Pair only on a trusted network.</small>
      </form>
    </section>

    <main class="conversation" id="conversation" aria-live="polite" hidden>
      <section class="welcome" id="welcome">
        <span class="welcome-mark" aria-hidden="true">F</span>
        <h1>What should we ferry?</h1>
        <p>Send text or a file to your other devices.</p>
      </section>
      <div class="messages" id="messages"></div>
    </main>

    <footer class="composer-shell" id="composer-shell" hidden>
      <form class="composer" id="composer">
        <div class="file-chip" id="file-chip" hidden>
          <span id="file-name"></span>
          <button type="button" id="remove-file" aria-label="Remove selected file">×</button>
        </div>
        <div class="composer-row">
          <label class="attach" aria-label="Attach a file">
            <input type="file" id="file" hidden>
            <span aria-hidden="true">＋</span>
          </label>
          <textarea id="text" rows="1" placeholder="Message Ferry" aria-label="Message"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>↑</button>
        </div>
      </form>
      <p class="footnote" id="status">Your data stays on this Ferry server.</p>
    </footer>

    <dialog class="devices-dialog" id="devices-dialog">
      <div class="dialog-head"><div><h2>Devices</h2><p id="current-device"></p></div><button id="close-devices" type="button" aria-label="Close">×</button></div>
      <div class="device-list" id="device-list"></div>
      <div class="pair-another">
        <button class="secondary" id="generate-code" type="button">Pair another device</button>
        <output id="generated-code" aria-live="polite"></output>
      </div>
    </dialog>
  </body>
</html>
